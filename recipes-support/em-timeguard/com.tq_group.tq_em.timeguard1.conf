<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="em-timeguard">
    <allow own="com.tq_group.tq_em.timeguard1"/>
    <allow send_destination="com.tq_group.tq_em.timeguard1"/>
  </policy>
  <policy context="default">
    <allow send_interface="com.tq_group.tq_em.timeguard1.TimeGuard"
           send_member="ClockEvent"/>
  </policy>
</busconfig>
